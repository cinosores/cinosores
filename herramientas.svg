<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 218" width="1280" height="218" role="img" aria-label="Herramientas. Producto: Jira, Azure DevOps, Scrum, Figma. Datos e integraciones: SQL, Postman, MuleSoft Anypoint, Power BI. Cloud e IA: AWS, Azure, Claude, Kiro, AI Studio.">
  <defs>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .h { font-size: 15px; fill: #8B949E; }
      .t { font-size: 15px; font-weight: 600; fill: #E6EDF3; text-anchor: middle; }
      .p { fill: #161B22; stroke: #30363D; stroke-width: 1.5; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1279" height="217" rx="18" fill="#0D1117" stroke="#30363D"/>

  <g class="sans">
    <!-- Producto -->
    <rect x="44" y="40" width="28" height="4" rx="2" fill="#5EEAD4"/>
    <text x="44" y="72" class="mono h">producto</text>
    <rect x="44" y="94" width="76" height="36" rx="18" class="p"/><text x="82" y="117" class="t">Jira</text>
    <rect x="130" y="94" width="138" height="36" rx="18" class="p"/><text x="199" y="117" class="t">Azure DevOps</text>
    <rect x="44" y="142" width="88" height="36" rx="18" class="p"/><text x="88" y="165" class="t">Scrum</text>
    <rect x="142" y="142" width="84" height="36" rx="18" class="p"/><text x="184" y="165" class="t">Figma</text>
    <rect x="236" y="142" width="96" height="36" rx="18" class="p"/><text x="284" y="165" class="t">draw.io</text>

    <line x1="412" y1="40" x2="412" y2="186" stroke="#30363D"/>

    <!-- Datos e integraciones -->
    <rect x="452" y="40" width="28" height="4" rx="2" fill="#DCB077"/>
    <text x="452" y="72" class="mono h">datos e integraciones</text>
    <rect x="452" y="94" width="72" height="36" rx="18" class="p"/><text x="488" y="117" class="t">SQL</text>
    <rect x="534" y="94" width="100" height="36" rx="18" class="p"/><text x="584" y="117" class="t">Postman</text>
    <rect x="644" y="94" width="120" height="36" rx="18" class="p"/><text x="704" y="117" class="t">REST / SOAP</text>
    <rect x="452" y="142" width="190" height="36" rx="18" class="p"/><text x="547" y="165" class="t">MuleSoft Anypoint</text>
    <rect x="652" y="142" width="104" height="36" rx="18" class="p"/><text x="704" y="165" class="t">Power BI</text>

    <line x1="844" y1="40" x2="844" y2="186" stroke="#30363D"/>

    <!-- Cloud e IA -->
    <rect x="884" y="40" width="28" height="4" rx="2" fill="#FF8A3D"/>
    <text x="884" y="72" class="mono h">cloud e IA</text>
    <rect x="884" y="94" width="76" height="36" rx="18" class="p"/><text x="922" y="117" class="t">AWS</text>
    <rect x="970" y="94" width="84" height="36" rx="18" class="p"/><text x="1012" y="117" class="t">Azure</text>
    <rect x="1064" y="94" width="84" height="36" rx="18" class="p"/><text x="1106" y="117" class="t">Claude</text>
    <rect x="884" y="142" width="76" height="36" rx="18" class="p"/><text x="922" y="165" class="t">Kiro</text>
    <rect x="970" y="142" width="148" height="36" rx="18" class="p"/><text x="1044" y="165" class="t">Google AI Studio</text>
  </g>
</svg>
