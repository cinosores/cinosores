<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 210" width="1280" height="210" role="img" aria-label="10+ años en producto y análisis; 3M+ socios en un programa de fidelización; 40 integraciones migradas">
  <defs>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .num { font-size: 76px; font-weight: 700; letter-spacing: -2px; }
      .lbl { font-size: 20px; fill: #C9D1D9; }
      .c { animation: up 0.6s ease-out both; }
      .c1 { animation-delay: 0.1s; } .c2 { animation-delay: 0.35s; } .c3 { animation-delay: 0.6s; }
      @keyframes up { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>
  <g class="sans">
    <g class="c c1">
      <rect x="0.5" y="0.5" width="413" height="209" rx="16" fill="#0D1117" stroke="#30363D"/>
      <rect x="36" y="30" width="40" height="5" rx="2.5" fill="#5EEAD4"/>
      <text x="34" y="118" class="num" fill="#E6EDF3">10+</text>
      <text x="36" y="154" class="lbl">años en producto</text>
      <text x="36" y="180" class="lbl">y análisis funcional</text>
    </g>
    <g class="c c2">
      <rect x="433.5" y="0.5" width="413" height="209" rx="16" fill="#0D1117" stroke="#30363D"/>
      <rect x="470" y="30" width="40" height="5" rx="2.5" fill="#DCB077"/>
      <text x="468" y="118" class="num" fill="#E6EDF3">3M+</text>
      <text x="470" y="154" class="lbl">socios en un programa</text>
      <text x="470" y="180" class="lbl">de fidelización</text>
    </g>
    <g class="c c3">
      <rect x="866.5" y="0.5" width="413" height="209" rx="16" fill="#0D1117" stroke="#30363D"/>
      <rect x="903" y="30" width="40" height="5" rx="2.5" fill="#FF8A3D"/>
      <text x="901" y="118" class="num" fill="#E6EDF3">40</text>
      <text x="903" y="154" class="lbl">integraciones migradas</text>
      <text x="903" y="180" class="lbl">a una nueva plataforma</text>
    </g>
  </g>
</svg>
