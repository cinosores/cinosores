<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Cintia Osores — Product Owner y Analista Funcional Senior">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363D"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="360" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .draw { stroke-dasharray: 460; animation: draw 2.4s ease-out 0.3s both; }
      .n { animation: pop 0.5s ease-out both; }
      .n1 { animation-delay: 0.4s; } .n2 { animation-delay: 1.0s; } .n3 { animation-delay: 1.6s; } .n4 { animation-delay: 2.2s; }
      .pulse { transform-origin: 1180px 214px; animation: pulse 2.2s ease-out 2.8s infinite; opacity: 0; }
      @keyframes draw { from { stroke-dashoffset: 460; } to { stroke-dashoffset: 0; } }
      @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.4); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="#0D1117"/>
    <rect width="1280" height="360" fill="url(#dots)" opacity="0.6"/>
    <rect width="1280" height="360" fill="url(#glow)"/>
    <rect x="0" y="0" width="8" height="360" fill="#FF8A3D"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="18" fill="none" stroke="#30363D"/>

  <!-- Identidad -->
  <text x="72" y="96" class="mono" font-size="17" fill="#8B949E">Buenos Aires, Argentina</text>
  <text x="68" y="172" class="sans" font-size="68" font-weight="700" fill="#E6EDF3" letter-spacing="-1.5">Cintia Osores</text>
  <text x="72" y="216" class="sans" font-size="25" fill="#C9D1D9">Product Owner y Analista Funcional Senior</text>

  <!-- Chips -->
  <g class="sans" font-size="16" font-weight="600">
    <rect x="72" y="252" width="84" height="36" rx="18" fill="#FF8A3D"/>
    <text x="114" y="276" text-anchor="middle" fill="#0D1117">CSPO</text>
    <rect x="168" y="252" width="118" height="36" rx="18" fill="none" stroke="#30363D" stroke-width="1.5"/>
    <text x="227" y="276" text-anchor="middle" fill="#E6EDF3">10+ años</text>
    <rect x="298" y="252" width="206" height="36" rx="18" fill="none" stroke="#30363D" stroke-width="1.5"/>
    <text x="401" y="276" text-anchor="middle" fill="#E6EDF3">Prototipos con IA</text>
  </g>

  <!-- Cómo trabajo: roadmap -->
  <text x="720" y="150" class="mono" font-size="16" fill="#8B949E">// cómo trabajo</text>
  <line x1="720" y1="214" x2="1180" y2="214" stroke="#30363D" stroke-width="3" stroke-linecap="round"/>
  <line x1="720" y1="214" x2="1180" y2="214" stroke="url(#line)" stroke-width="3" stroke-linecap="round" class="draw"/>

  <circle cx="1180" cy="214" r="12" fill="none" stroke="#FF8A3D" stroke-width="2" class="pulse"/>

  <g class="sans" font-size="18" font-weight="600" text-anchor="middle">
    <g class="n n1">
      <circle cx="720" cy="214" r="11" fill="#0D1117" stroke="#5EEAD4" stroke-width="3"/>
      <text x="720" y="258" fill="#E6EDF3">Relevar</text>
      <text x="720" y="186" class="mono" font-size="13" font-weight="400" fill="#8B949E">01</text>
    </g>
    <g class="n n2">
      <circle cx="873" cy="214" r="11" fill="#0D1117" stroke="#9FD6AC" stroke-width="3"/>
      <text x="873" y="258" fill="#E6EDF3">Priorizar</text>
      <text x="873" y="186" class="mono" font-size="13" font-weight="400" fill="#8B949E">02</text>
    </g>
    <g class="n n3">
      <circle cx="1027" cy="214" r="11" fill="#0D1117" stroke="#DCB077" stroke-width="3"/>
      <text x="1027" y="258" fill="#E6EDF3">Especificar</text>
      <text x="1027" y="186" class="mono" font-size="13" font-weight="400" fill="#8B949E">03</text>
    </g>
    <g class="n n4">
      <circle cx="1180" cy="214" r="11" fill="#FF8A3D"/>
      <text x="1180" y="258" fill="#E6EDF3">Validar</text>
      <text x="1180" y="186" class="mono" font-size="13" font-weight="400" fill="#8B949E">04</text>
    </g>
  </g>
</svg>
