<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 182 36" width="182" height="36" role="img" aria-label="Ver portfolio interactivo"><defs><style>@font-face{font-family:GS;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:GS;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:GS;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:GM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}text{font-family:GS,"Geist",-apple-system,"Segoe UI",sans-serif;font-feature-settings:"tnum"}.in{animation:in 280ms cubic-bezier(.16,1,.3,1) both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.live{animation:live 1.6s cubic-bezier(.4,0,.2,1) infinite alternate}@keyframes live{from{opacity:1}to{opacity:.35}}@media (prefers-reduced-motion:reduce){.in,.live,.mv,.st,.col,.au{animation:none!important}}</style><linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#3F3F46" stop-opacity="0"/><stop offset=".5" stop-color="#3F3F46"/><stop offset="1" stop-color="#3F3F46" stop-opacity="0"/></linearGradient></defs><g class="in"><rect x="0" y="0" width="182" height="36" rx="6" fill="#7C7CF0"/><text x="16.0" y="23.0" font-size="13" font-weight="500" fill="#0B0B10" text-anchor="start"  >Ver portfolio interactivo</text></g></svg>